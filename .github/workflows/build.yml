name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/TrackPadForWindows -c Release -r win-x64 --self-contained true -p:DebugType=none -o dist/TrackPadForWindows

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/TrackPadForWindows -DestinationPath dist/TrackPadForWindows-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TrackPadForWindows-win-x64
          path: dist/TrackPadForWindows-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist/TrackPadForWindows-win-x64.zip -Algorithm SHA256).Hash
          "SHA256: ``$hash``" | Out-File notes.md -Encoding utf8
          gh release create ${{ github.ref_name }} dist/TrackPadForWindows-win-x64.zip --title "TrackPad For Windows ${{ github.ref_name }}" --notes-file notes.md --generate-notes
