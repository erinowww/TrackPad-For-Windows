name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/TrackPadForWindows -c Release -r win-x64 --self-contained true -p:DebugType=none -o dist/TrackPadForWindows

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/TrackPadForWindows -DestinationPath dist/TrackPadForWindows-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TrackPadForWindows-win-x64
          path: dist/TrackPadForWindows-win-x64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $hash = (Get-FileHash dist/TrackPadForWindows-win-x64.zip -Algorithm SHA256).Hash
          gh release upload $tag dist/TrackPadForWindows-win-x64.zip --clobber
          $body = gh release view $tag --json body -q .body
          "$body`n`n**SHA256** (TrackPadForWindows-win-x64.zip): ``$hash``" | Out-File notes.md -Encoding utf8
          gh release edit $tag --notes-file notes.md
